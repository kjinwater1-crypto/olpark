name: 실시간 주차 기록
# 홈페이지 실시간 주차 대수를 20분마다 live 브랜치에 기록합니다.
# 한 번 실행하면 약 5시간 40분 동안 기록하고, 끝날 때 다음 실행을 스스로 예약합니다(예약 실행이 늦게 시작될 때를 대비).
on:
  schedule:
    - cron: '4,24,44 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/live.yml', 'live/record.py']
permissions:
  contents: write
  actions: write
concurrency:
  group: live-parking-log
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        with:
          ref: live
          path: log
      - name: 기록
        working-directory: log
        env:
          LOOPS: ${{ github.event_name == 'schedule' && '1' || '17' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 "$LOOPS"); do
            git pull -q --rebase origin live || true
            python3 ../src/live/record.py .
            git add -A
            if ! git diff --cached --quiet; then
              git commit -q -m "실시간 주차 기록 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
              for k in 1 2 3; do git push -q origin HEAD:live && break; sleep 5; git pull -q --rebase origin live; done
            fi
            if [ "$i" -lt "$LOOPS" ]; then sleep 1200; fi
          done
      - name: 다음 기록 예약
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for k in 1 2 3; do gh workflow run live.yml --repo "${{ github.repository }}" --ref main && break; sleep 30; done
