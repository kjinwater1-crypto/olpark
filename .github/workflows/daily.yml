name: 매일 예보 갱신
# 매일 04:17 KST에 공연 일정을 새로 받아 예보와 index.html을 다시 만듭니다.
# 예약 실행이 늦거나 빠질 때를 대비해 실시간 기록 작업이 끝날 때 이 작업을 확인하고 필요하면 실행합니다.
on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/daily.yml', 'pipeline/run_site.py', 'pipeline/app/template.html', 'pipeline/scripts/**']
permissions:
  contents: write
concurrency:
  group: daily-forecast
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: 패키지 설치
        run: pip install -r pipeline/requirements.txt
      - name: 실시간 기록 가져오기
        run: |
          git fetch --depth=1 origin live
          git show FETCH_HEAD:rt_log.csv > pipeline/data/live_rt_log_github.csv || true
      - name: 예보 갱신
        run: python pipeline/run_site.py
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pipeline/data
          if ! git diff --cached --quiet; then
            git commit -q -m "매일 예보 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d')"
            for i in 1 2 3; do git push -q origin HEAD:main && break; sleep 5; git pull -q --rebase origin main; done
          fi
